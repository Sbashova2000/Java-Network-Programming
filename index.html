<!doctype html>
<html lang="bg">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>WebSocket Chat (Rooms + Online Users + History + Private)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f6f7fb; }
        header { padding: 14px 18px; background: #111827; color: white; display:flex; gap:12px; align-items:center; }
        header strong { font-size: 14px; opacity: .9; }
        main { display: grid; grid-template-columns: 280px 1fr 280px; gap: 12px; padding: 12px; height: calc(100vh - 52px); box-sizing: border-box; }
        .card { background: white; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.06); padding: 12px; display:flex; flex-direction:column; min-height: 0; }
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #111827; }
        label { font-size: 12px; color:#374151; display:block; margin: 8px 0 4px;}
        input, button, select { padding: 10px; border-radius: 10px; border: 1px solid #e5e7eb; font-size: 14px; }
        button { cursor:pointer; background:#111827; color:white; border: none; }
        button.secondary { background: #374151; }
        button.danger { background: #b91c1c; }
        .row { display:flex; gap: 8px; align-items:center; }
        .row > * { flex: 1; }
        #log, #privateLog { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: #0b1020; color: #e5e7eb; border-radius: 12px; padding: 10px; overflow:auto; flex: 1; }
        .tag { display:inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px; background:#eef2ff; color:#3730a3; }
        ul { list-style: none; padding: 0; margin: 0; overflow:auto; }
        li { padding: 8px 10px; border-radius: 10px; border: 1px solid #f3f4f6; margin-bottom: 8px; font-size: 13px; }
        .muted { color:#6b7280; font-size: 12px; }
        .small { font-size: 12px; }
    </style>
</head>
<body>
<header>
    <strong>WebSocket Chat</strong>
    <span class="tag">Rooms • Online users • History • Private</span>
    <span id="status" class="muted"></span>
</header>

<main>
    <section class="card">
        <h3>Вход</h3>

        <label>Потребителско име</label>
        <input id="username" placeholder="например: sibil" />

        <label>Стая (room)</label>
        <input id="room" value="general" />

        <div class="row" style="margin-top:10px;">
            <button id="connectBtn">Connect</button>
            <button id="disconnectBtn" class="secondary" disabled>Disconnect</button>
        </div>

        <hr style="border:none;border-top:1px solid #f3f4f6; margin:12px 0;">

        <h3>Online users (в стаята)</h3>
        <ul id="users"></ul>
    </section>

    <section class="card">
        <div class="row" style="justify-content:space-between;">
            <h3 style="margin:0;">Room chat</h3>
            <div class="muted small">Room: <span id="roomBadge">-</span></div>
        </div>

        <div id="log"></div>

        <div class="row" style="margin-top:10px;">
            <input id="message" placeholder="Напиши съобщение..." />
            <button id="sendBtn" disabled>Send</button>
        </div>

        <!--  Switch room + Dropdown -->
        <div class="row equal-buttons" style="margin-top:8px;">
            <div class="dropdown">
                <button id="switchRoomBtn" class="dropbtn" disabled>
                    Switch room ▼
                </button>

                <div id="roomMenu" class="dropdown-content">
                    <!-- rooms ще се добавят от JS -->
                </div>
            </div>

            <button id="clearBtn" class="secondary">Clear</button>
        </div>
    </section>
    <section class="card">
        <h3>Private messages</h3>

        <label>До (username)</label>
        <input id="pmTo" placeholder="например: ivan" />

        <label>Съобщение</label>
        <div class="row">
            <input id="pmText" placeholder="private message..." />
            <button id="pmSendBtn" class="danger" disabled>Send</button>
        </div>

        <div class="muted small" style="margin-top:10px;">
            Private съобщения идват в <code>/user/queue/private</code>.
        </div>

        <div id="privateLog" style="margin-top:10px;"></div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
